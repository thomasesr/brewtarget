[workspace]
resolver = "3"
members = [
   "crates/bt-measure",
   "crates/bt-model",
   "crates/bt-calc",
   "crates/bt-schema",
   "crates/bt-store",
   "crates/bt-format",
   "crates/bt-api",
   "crates/bt-server",
   "crates/bt-ui",
   "crates/bt-web",
]

[workspace.package]
version       = "0.1.0"
edition       = "2024"
rust-version  = "1.90"
license       = "GPL-3.0-or-later"
repository    = "https://github.com/Brewtarget/brewtarget"
authors       = ["The Brewtarget contributors"]

[workspace.dependencies]
# Internal crates
bt-measure = { path = "crates/bt-measure" }
bt-model   = { path = "crates/bt-model"   }
bt-calc    = { path = "crates/bt-calc"    }
bt-schema  = { path = "crates/bt-schema"  }
bt-store   = { path = "crates/bt-store"   }
bt-format  = { path = "crates/bt-format"  }
bt-api     = { path = "crates/bt-api"     }
bt-ui      = { path = "crates/bt-ui"      }

# Errors and logging
thiserror     = "2"
anyhow        = "1"
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialisation
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Persistence.  All three backends are compiled in; the active one is chosen at runtime.
sqlx = { version = "0.8", default-features = false, features = [
   "runtime-tokio-rustls", "any", "sqlite", "postgres", "mysql", "chrono", "macros",
] }

# Async runtime and HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal"] }
axum  = "0.8"
tower = "0.5"
utoipa = { version = "6", features = ["axum_extras", "chrono"] }

# Frontend.  Dioxus renders the same components to a browser, a desktop window and a
# phone, which is why the UI is Rust rather than TypeScript: it shares `bt-model` and
# `bt-calc` with the server instead of restating them.
dioxus = { version = "0.7.10" }
# `reqwest` is the one HTTP client that works both natively and in a browser, so the
# API client is written once.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"] }

# Domain support
chrono     = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
quick-xml  = { version = "0.37", features = ["serialize"] }
jsonschema = "0.26"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = true
