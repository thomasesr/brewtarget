[package]
name        = "bt-model"
description = "Brewtarget domain entities"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
utoipa.workspace = true
bt-measure.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
sqlx = { workspace = true, optional = true }

[features]
# Reading a row straight out of a database.  Off by default so that a build with no
# database in it -- a browser, most obviously -- does not pull in three drivers.
sqlx = ["dep:sqlx"]

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
