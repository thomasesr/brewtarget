# CI for the Rust/Bun web port.  The legacy Qt/C++ build is covered by the other
# workflows in this directory; this one deliberately touches neither Qt nor Boost.
name: port

on:
  push:
    paths: ['rust/**', 'web/**', 'tools/**', 'schema/**', '.github/workflows/port.yml']
  pull_request:
    paths: ['rust/**', 'web/**', 'tools/**', 'schema/**', '.github/workflows/port.yml']

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Schema extraction is reproducible
        run: |
          python3 tools/extract-schema.py --out /tmp/v23.json
          diff -u schema/v23.json /tmp/v23.json
      - name: Migration extraction is reproducible
        run: |
          python3 tools/extract-migrations.py --out /tmp/migrations.json
          diff -u schema/migrations.json /tmp/migrations.json
      - name: Unit extraction is reproducible
        run: |
          python3 tools/extract-units.py --out /tmp/units.json
          diff -u schema/units.json /tmp/units.json
      - name: Calculation data extraction is reproducible
        run: |
          python3 tools/extract-calc-data.py --out /tmp/calculations.json
          diff -u schema/calculations.json /tmp/calculations.json
      - name: Enum extraction is reproducible
        run: |
          python3 tools/extract-enums.py --out /tmp/enums.json
          diff -u schema/enums.json /tmp/enums.json
      - name: Generated model code is reproducible
        run: |
          python3 tools/generate-model.py --out /tmp/generated --store-out /tmp/generated-store --api-out /tmp/generated-api
          diff -ru rust/crates/bt-model/src/generated /tmp/generated
          diff -ru rust/crates/bt-store/src/generated /tmp/generated-store
          diff -ru rust/crates/bt-api/src/generated /tmp/generated-api
      - name: Format extraction is reproducible
        run: |
          python3 tools/extract-formats.py --out /tmp/formats.json
          diff -u schema/formats.json /tmp/formats.json
      - name: Expected test values are reproducible
        run: |
          python3 tools/extract-test-data.py --out /tmp/expected
          diff -ru testData/expected /tmp/expected
